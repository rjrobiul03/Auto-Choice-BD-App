name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install & Build Web App
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - name: Apply Custom App Launcher Icon
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/app-icon.png "$dir/ic_launcher.png"
              cp public/app-icon.png "$dir/ic_launcher_round.png"
            fi
          done
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-choice-bd-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
